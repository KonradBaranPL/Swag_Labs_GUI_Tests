[pytest]
addopts =
    --screenshot only-on-failure
    --output test-results/
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: Smoke tests -- run after every deploy (~5 min)
    e2e: End-to-end tests -- full user flows (~30 min)
    negative: Negative tests -- error handling and validation

testpaths = tests
python_files = test_*.py
python_functions = test_*